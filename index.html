    <script>
      // Defend against "Cannot set property fetch of #<Window> which has only a getter"
      // in sandboxed iframes or platform interceptors that attempt to reassign window.fetch.
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = typeof originalFetch === 'function' ? function() {
            return originalFetch.apply(window, arguments);
          } : undefined;

          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            }
          });
        } catch (e) {
          try {
            var protoFetch = Window.prototype.fetch;
            var protoActive = protoFetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return protoActive;
              },
              set: function(fn) {
                protoActive = fn;
              }
            });
          } catch (e2) {}
        }
      })();
    </script>
